name: Update NAYUTA PUBLIC Feed

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-note-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Note RSS and update note.json
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime

          RSS_URL = "https://note.com/nayuta_public_/rss"

          req = urllib.request.Request(
              RSS_URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              xml_data = response.read()

          root = ET.fromstring(xml_data)

          items = []

          for item in root.findall(".//item"):
              title = item.findtext("title", default="").strip()
              link = item.findtext("link", default="").strip()
              description = item.findtext("description", default="").strip()
              pub_date = item.findtext("pubDate", default="").strip()

              date = ""

              if pub_date:
                  try:
                      dt = parsedate_to_datetime(pub_date)
                      date = dt.strftime("%Y-%m-%d")
                  except Exception:
                      date = pub_date

              items.append({
                  "title": title,
                  "link": link,
                  "description": description,
                  "date": date
              })

          data = {
              "updated": True,
              "source": RSS_URL,
              "items": items[:10]
          }

          with open("note.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add note.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update NAYUTA PUBLIC feed"
            git push
          fi
